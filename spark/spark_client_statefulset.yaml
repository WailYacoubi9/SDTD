apiVersion: v1
kind: Service
metadata:
  name: spark-client
  namespace: data-pipeline
  labels:
    app: spark-client
spec:
  clusterIP: None
  selector:
    app: spark-client
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-client
  namespace: data-pipeline
spec:
  serviceName: spark-client
  replicas: 1
  selector:
    matchLabels:
      app: spark-client
  template:
    metadata:
      labels:
        app: spark-client
    spec:
      containers:
        - name: spark-client
          image: rabii10/spark-image:v2
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["/bin/bash", "-c"]
          args:
            - |
              apt-get update && apt-get install -y nano iputils-ping dnsutils
              echo "Spark client ready"
              sleep infinity
          ports:
            - containerPort: 8081
              name: driver
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: spark-jobs
              mountPath: /opt/spark/work-dir
  volumeClaimTemplates:
    - metadata:
        name: spark-jobs
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi