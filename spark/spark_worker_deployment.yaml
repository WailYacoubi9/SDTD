apiVersion: v1
kind: Service
metadata:
  name: spark-worker-svc
  namespace: data-pipeline
  labels:
    app: spark-worker
spec:
  type: ClusterIP
  selector:
    app: spark-worker
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: data-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
        - name: spark-worker
          image: rabii10/spark-image:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: SPARK_MODE
              value: worker
            - name: SPARK_MASTER_URL
              value: spark://spark-master:7077   # reach master via K8s DNS
            - name: SPARK_WORKER_WEBUI_PORT
              value: "8081"
            - name: SPARK_WORKER_MEMORY
              value: "1G"
            - name: SPARK_WORKER_CORES
              value: "2"
          command: ["/bin/bash", "-c"]
          args:
            - |
              /opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
              tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker*.out

          ports:
            - containerPort: 8081
              name: webui
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: "1Gi"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spark-worker-hpa
  namespace: data-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spark-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80