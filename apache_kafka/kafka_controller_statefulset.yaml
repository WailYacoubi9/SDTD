apiVersion: v1
kind: Service
metadata:
  name: kafka-controller
  namespace: data-pipeline
  labels:
    app: kafka-controller
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: kafka-controller
  ports:
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-controller
  namespace: data-pipeline
spec:
  serviceName: kafka-controller
  replicas: 1
  selector:
    matchLabels:
      app: kafka-controller
  template:
    metadata:
      labels:
        app: kafka-controller
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              
              CLUSTER_ID="laA2BR9-So-1wGxQEMI_EQ"
              NODE_ID=1
              
              # Configuration du contrôleur KRaft
              cat > /var/lib/kafka/data/controller.properties <<EOF
              process.roles=controller
              node.id=${NODE_ID}
              controller.listener.names=CONTROLLER
              controller.quorum.voters=1@kafka-controller-0.kafka-controller:9093
              listeners=CONTROLLER://:9093
              listener.security.protocol.map=CONTROLLER:PLAINTEXT
              inter.broker.listener.name=CONTROLLER
              
              log.dirs=/var/lib/kafka/data
              num.partitions=3
              offsets.topic.replication.factor=1
              transaction.state.log.replication.factor=1
              transaction.state.log.min.isr=1
              auto.create.topics.enable=true
              EOF
              
              # Formatage du stockage si nécessaire
              if [ ! -f /var/lib/kafka/data/meta.properties ]; then
                /opt/kafka/bin/kafka-storage.sh format \
                  --cluster-id ${CLUSTER_ID} \
                  --config /var/lib/kafka/data/controller.properties \
                  --ignore-formatted
              fi
              
              exec /opt/kafka/bin/kafka-server-start.sh /var/lib/kafka/data/controller.properties
          ports:
            - containerPort: 9093
              name: controller
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          livenessProbe:
            tcpSocket:
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9093
            initialDelaySeconds: 20
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi