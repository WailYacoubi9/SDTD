apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  namespace: data-pipeline
  labels:
    app: kafka-broker
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: kafka-broker
  ports:
    - name: broker
      port: 19092
      targetPort: 19092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: data-pipeline
spec:
  serviceName: kafka-broker
  replicas: 2
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      initContainers:
        - name: broker-init
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              
              CLUSTER_ID="laA2BR9-So-1wGxQEMI_EQ"
              
              # Extraction de l'ordinal du pod
              ORDINAL=$(echo ${HOSTNAME} | awk -F- '{print $NF}')
              NODE_ID=$((ORDINAL + 2))
              
              echo "Initializing broker ${NODE_ID} (${HOSTNAME})"
              
              # DNS stable pour ce broker
              THIS_DNS="${HOSTNAME}.kafka-broker"
              
              # Configuration du broker
              cat > /var/lib/kafka/data/broker.properties <<EOF
              process.roles=broker
              node.id=${NODE_ID}
              
              listeners=INTERNAL://:19092
              listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
              advertised.listeners=INTERNAL://${THIS_DNS}:19092
              inter.broker.listener.name=INTERNAL
              
              controller.listener.names=CONTROLLER
              controller.quorum.voters=1@kafka-controller-0.kafka-controller:9093
              
              log.dirs=/var/lib/kafka/data
              num.partitions=3
              offsets.topic.replication.factor=1
              transaction.state.log.replication.factor=1
              transaction.state.log.min.isr=1
              auto.create.topics.enable=true
              
              # Optimisations
              log.retention.hours=24
              log.segment.bytes=1073741824
              log.retention.check.interval.ms=300000
              EOF
              
              # Formatage si nécessaire
              if [ ! -f /var/lib/kafka/data/meta.properties ]; then
                /opt/kafka/bin/kafka-storage.sh format \
                  --cluster-id ${CLUSTER_ID} \
                  --config /var/lib/kafka/data/broker.properties \
                  --ignore-formatted
              fi
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec /opt/kafka/bin/kafka-server-start.sh /var/lib/kafka/data/broker.properties
          ports:
            - containerPort: 19092
              name: broker
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          livenessProbe:
            tcpSocket:
              port: 19092
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 19092
            initialDelaySeconds: 30
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 3Gi