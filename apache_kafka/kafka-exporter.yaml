apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: data-pipeline
  labels:
    app: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9308"
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.7.0
          imagePullPolicy: IfNotPresent
          args:
            - "--kafka.server=kafka-broker-0.kafka-broker:19092"
            - "--kafka.server=kafka-broker-1.kafka-broker:19092"
            - "--web.listen-address=:9308"
            - "--topic.filter=.*"
            - "--group.filter=.*"
          ports:
            - containerPort: 9308
              name: metrics
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: data-pipeline
  labels:
    app: kafka-exporter
spec:
  selector:
    app: kafka-exporter
  ports:
    - port: 9308
      targetPort: 9308
      name: metrics