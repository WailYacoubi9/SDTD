apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: data-pipeline
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: data-pipeline
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards
  
  kafka-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Kafka Metrics",
        "tags": ["kafka"],
        "timezone": "browser",
        "panels": [
          {
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "id": 1,
            "title": "Messages Per Second",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(kafka_server_broker_topic_metrics_messages_in_total[5m])",
                "refId": "A"
              }
            ]
          },
          {
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "id": 2,
            "title": "Consumer Lag",
            "type": "graph",
            "targets": [
              {
                "expr": "kafka_consumer_lag_sum",
                "refId": "A"
              }
            ]
          }
        ]
      }
    }
  
  spark-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Spark Metrics",
        "tags": ["spark"],
        "timezone": "browser",
        "panels": [
          {
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "id": 1,
            "title": "Active Jobs",
            "type": "stat",
            "targets": [
              {
                "expr": "spark_info_application_active_jobs",
                "refId": "A"
              }
            ]
          },
          {
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "id": 2,
            "title": "Executor Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "spark_info_jvm_heap_used",
                "refId": "A"
              }
            ]
          }
        ]
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: data-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin123
            - name: GF_INSTALL_PLUGINS
              value: grafana-piechart-panel
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboard-definitions
              mountPath: /etc/grafana/provisioning/dashboards/definitions
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: grafana-storage
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: grafana-dashboard-definitions
          configMap:
            name: grafana-dashboards
            items:
              - key: kafka-dashboard.json
                path: kafka-dashboard.json
              - key: spark-dashboard.json
                path: spark-dashboard.json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: data-pipeline
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030